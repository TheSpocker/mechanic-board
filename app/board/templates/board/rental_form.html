<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if rental.pk %}Edit Rental Contract{% else %}New Rental Contract{% endif %}</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #eef1f4; font-family: Arial, sans-serif; color: #1d2329; }
        .page { width: min(980px, calc(100% - 32px)); margin: 24px auto; }
        .toolbar { margin-bottom: 18px; }
        .toolbar a { color: #17395f; text-decoration: none; font-weight: bold; }
        .card { background: white; border-radius: 12px; padding: 28px; box-shadow: 0 4px 18px rgba(0,0,0,.08); }
        h1 { margin-top: 0; }
        .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
        .full { grid-column: 1 / -1; }
        label { display: block; margin-bottom: 6px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #aeb6bf; border-radius: 6px; font: inherit; }
        .actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 28px; }
        button, .cancel { border: 0; border-radius: 7px; padding: 12px 20px; color: white; text-decoration: none; font-weight: bold; }
        button { background: #17395f; cursor: pointer; }
        .cancel { background: #6b737c; }
        .errorlist { color: #a00000; }
        @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } .full { grid-column: auto; } }
    </style>
</head>
<body>
<div class="page">
    <div class="toolbar"><a href="{% url 'board' %}">← Dashboard</a></div>
    <form method="post" class="card">
        {% csrf_token %}
        <h1>{% if rental.pk %}Edit Rental Contract #{{ rental.pk }}{% else %}New Rental Contract{% endif %}</h1>
        {{ form.non_field_errors }}
        <div class="grid">
            {% for field in form %}
                <div class="{% if field.name == 'notes' %}full{% endif %}">
                    {{ field.label_tag }}
                    {{ field.errors }}
                    {{ field }}
                </div>
            {% endfor %}
        </div>
        <div class="actions">
            <a href="{% url 'board' %}" class="cancel">Cancel</a>
            <button type="submit">Save Contract</button>
        </div>
    </form>
</div>
</body>
</html>
