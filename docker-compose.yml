services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: shopdb
      POSTGRES_USER: shopuser
      POSTGRES_PASSWORD: shoppass
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - default

  web:
    build: ./app
    environment:
      DJANGO_SECRET_KEY: dev-secret-change-later
      DJANGO_DEBUG: "1"
      DB_NAME: shopdb
      DB_USER: shopuser
      DB_PASSWORD: shoppass
      DB_HOST: db
      DB_PORT: "5432"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app:Z
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - default

volumes:
  pgdata:

networks:
  default:
    name: mechanic-board_default
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.250.0/24
